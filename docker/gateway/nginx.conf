events {
  worker_connections 1024;
}

http {
  upstream nextjs {
    server app:3000;
  }

  upstream gotrue {
    server auth:9999;
  }

  server {
    listen 3010;

    # Supabase Auth API — strip /auth/v1 prefix and forward to GoTrue
    location /auth/v1/ {
      rewrite ^/auth/v1/(.*) /$1 break;
      proxy_pass http://gotrue;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js application (production build via `next start`: no HMR, so no WebSocket upgrade headers)
    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      # Reason: $host drops the port. Next.js compares the browser Origin (localhost:3010) with this host for
      # Server Actions and rejects the request when they differ, so keep the port with $http_host.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
