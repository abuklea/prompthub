##
## PromptHub — local Docker setup
##
## Usage:
##   docker compose up --build        # first run (builds app image)
##   docker compose up                # subsequent runs
##   docker compose down -v           # tear down and delete data
##
## The app is available at http://localhost:3010 after all services start.
## Sign up with any email/password — emails are auto-confirmed locally.
##

# JWT tokens for local development only — standard Supabase demo keys.
x-supabase-jwt: &jwt-secret "super-secret-jwt-token-with-at-least-32-characters-long"
x-supabase-anon-key: &anon-key "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
x-supabase-service-key: &service-key "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── GoTrue (Supabase Auth) ─────────────────────────────────────
  auth:
    image: supabase/gotrue:v2.164.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "http://localhost:3010"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://postgres:postgres@db:5432/postgres?sslmode=disable&search_path=auth"
      GOTRUE_SITE_URL: "http://localhost:3010"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API Gateway (nginx) ────────────────────────────────────────
  # Routes /auth/v1/* → GoTrue, everything else → Next.js app.
  # This lets browser and server share one SUPABASE_URL origin.
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3010:3010"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    # Reason: nginx resolves the upstream hostnames at start-up and exits when `app` is not yet resolvable.
    depends_on:
      auth:
        condition: service_healthy
      app:
        condition: service_healthy

  # ── Next.js Application ────────────────────────────────────────
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: "http://localhost:3010"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: *anon-key
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres"
      DIRECT_URL: "postgresql://postgres:postgres@db:5432/postgres"
      SUPABASE_URL: "http://gateway:3010"
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:3010"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: *anon-key
      SUPABASE_SERVICE_ROLE_KEY: *service-key
    # The runner image has no curl or wget, so probe with node. `prisma migrate deploy` runs before the server
    # starts: start_period covers it. Any response below 500 counts as up (the root redirects to the login page).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', {redirect: 'manual'}).then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  pgdata:
