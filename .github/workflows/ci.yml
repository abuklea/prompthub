name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: prompthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d prompthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Placeholder values for the build and prisma validate: neither connects to a database or Supabase, because all
      # clients are constructed lazily inside request handlers, not at build time. Only the database-backed tests
      # connect, to the throwaway postgres service above, through TEST_DATABASE_URL.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      TEST_DATABASE_URL: postgresql://user:pass@localhost:5432/prompthub_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/prompthub_test
          DIRECT_URL: postgresql://user:pass@localhost:5432/prompthub_test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Code-size audit
        run: bash scripts/audit-code-size.sh --summary

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
